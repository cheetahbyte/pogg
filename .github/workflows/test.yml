name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/pogg
      - run: go test ./internal/cli -run TestPostgresLifecycle -v -count=1
        env:
          PGPLEASE_INTEGRATION: '1'
